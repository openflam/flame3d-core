# =============================================================================
# flame3d-core stack
#   server              : Flask API (enqueues jobs, serves status) — light image
#   segmentation-worker : Celery worker that runs the GPU pipeline — heavy image
#   rabbitmq            : Celery broker (task queue)
#   redis               : Celery result backend (job status + live progress)
#   postgis             : Postgres + PostGIS — dataset index (and future 3D data)
#   frontend            : Vite dev server
# =============================================================================

services:
  # ── Spatial database (dataset index + future per-dataset 3D tables) ───────
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=flame
      - POSTGRES_PASSWORD=flame
      - POSTGRES_DB=flame3d
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flame -d flame3d"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Message broker ────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Result backend ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Flask API (lightweight: Flask + Celery client only) ───────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5005:5005"
    volumes:
      # Mount the project so code changes are picked up on restart. The API
      # only needs the `server` package and config_io.py.
      - .:/app
    # Inject the repo-root .env (gitignored) as the single source of secrets —
    # OPENAI_API_KEY / ANTHROPIC_API_KEY for the tool-calling search agent, etc.
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://flame:flame@postgis:5432/flame3d
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery worker (heavy: full ML stack + GPU, runs the pipeline) ─────────
  segmentation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Run the Celery worker inside the flame3d-core conda env. Concurrency 1:
    # the pipeline saturates the GPU, so only one job runs at a time.
    command: >
      conda run --no-capture-output -n flame3d-core
      celery -A server.celery_app:celery_app worker
      --loglevel=info --concurrency=1
    volumes:
      # Mount the entire project so code changes are picked up on restart
      - .:/app
      # Persist HuggingFace model cache across container rebuilds
      - ${HF_CACHE_DIR:-./hf_cache}:/root/.cache/huggingface
    # Inject the repo-root .env (gitignored) as the single source of secrets
    # (HF_TOKEN for model downloads, plus any LLM keys).
    env_file:
      - path: .env
        required: false
    environment:
      # Put the project root on sys.path *permanently*. The `celery` console
      # script (unlike `python -m`) only adds the cwd to sys.path transiently
      # while resolving -A, so root-level packages (data_processor, segment3d,
      # config_io) would otherwise fail to import once a task runs.
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://flame:flame@postgis:5432/flame3d
    # GPU passthrough via NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "16gb"
    # Allow unlimited locked (pinned) memory and a large stack.
    # vLLM stages model weights into the GPU via pinned host memory; Docker's
    # default memlock limit (8 MB) forces a pathologically slow pageable-copy
    # fallback (~50 MB/s), making weight loading take minutes instead of seconds.
    # These match NVIDIA's recommended container ulimits.
    ulimits:
      memlock: -1
      stack: 67108864
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite dev server) ────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    # Install deps then start the Vite dev server. Anonymous volume keeps the
    # container's node_modules separate from the host's (which may be absent or
    # built for a different platform).
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      # Proxy /api requests to the Flask service over the compose network.
      - VITE_API_TARGET=http://server:5005
    depends_on:
      - server
    restart: unless-stopped

# Named volumes
volumes:
  postgis_data:
